<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Illustration representing teaching and learning in computer science</title>
  <desc id="desc">An editorial illustration showing a laptop with code, floating cards for idea, build, and learn, and connecting nodes.</desc>
  <defs>
